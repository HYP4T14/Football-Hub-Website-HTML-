    <title>Indonesian League One</title>

</head>
<body>
    <header>
        <section id="identity">
            <fieldset>
                <h1>Indonesian League One</h1>
            </fieldset>
        </section>
        <section id="navigation">
            <fieldset>
                <legend><h2>Menu</h2></legend>
                <nav id="thisPage">
                    <aside>
                        <details>
                            <summary>This Page</summary>
                            <ul>
                                <li><a href="#contact">Contact</a></li>
                            </ul>
                        </details>
                    </aside>
                </nav>
                <nav id="anotherPage">
                    <aside>
                        <details>
                            <summary>Another Page</summary>
                            <ul>

                            </ul>
                        </details>
                    </aside>
                </nav>
            </fieldset>
        </section>
    </header>
    <hr>
    <main>
        <section id="contact">
            <fieldset>
                <legend><h2>Contact</h2></legend>
                <form action="https://httpbin.org/post" method="post">
                    <p>
                        <label for="name">Name :</label>
                        <input type="text" name="name" id="name" placeholder="Input Your Name" autocomplete="on" required autofocus>
                    </p>
                    <p>
                        <label for="email">Email :</label>
                        <input type="email" name="email" id="email" placeholder="Input Your Email" autocomplete="on" required>
                    </p>
                    <p>
                        <label for="subject">Subject :</label>
                        <input type="text" name="subject" id="subject" placeholder="Write The Subject" required>
                    </p>
                    <p>
                        <label for="category">Category :</label>
                        <select name="category" id="category" required>
                            <option value="">--Select Here--</option>
                            <option value="suggestion">Suggestion</option>
                            <option value="criticism">Criticism</option>
                            <option value="review">Review</option>
                            <option value="question">Question</option>
                        </select>
                    </p>
                    <p>
                        <fieldset>
                            <legend><h3>Preferred Contact</h3></legend>
                            <p>
                                <input type="radio" id="gmail" name="preferred" value="gmail">
                                <label for="gmail">Email</label>
                            </p>
                            <p>
                                <input type="radio" id="whatsapp" name="preferred" value="whatsapp">
                                <label for="whatsapp">WhatsApp</label>
                            </p>
                            <p>
                                <input type="radio" id="another" name="preferred" value="another">
                                <label for="another">Another (Social Media)</label>
                            </p>
                        </fieldset>
                    </p>
                    <button type="submit">Submit</button>
                </form>
            </fieldset>
        </section>
    </main>
    <hr>
    <footer>
        <fieldset>
            <nav id="footer">
                <button type="button"><a href="about.html">Previous Page</a></button>
            </nav>
        </fieldset>
    </footer>
</body>
</html>
